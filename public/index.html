<!DOCTYPE html><html lang='uz'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#030a14'><meta name='apple-mobile-web-app-capable' content='yes'><title>Jarvis</title>
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:#030a14;color:#c9f7ff;font:15px ui-monospace,Menlo,monospace;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;padding:10px 14px;font-size:12px;letter-spacing:.2em;color:#22d3ee;border-bottom:1px solid #22d3ee33}
#st{flex:1;min-height:0;position:relative}#c{width:100%;height:100%}#s{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.3em;color:#22d3ee}
#log{height:30vh;overflow:auto;padding:8px 14px}#log p{margin:5px 0;padding:6px 10px;border-left:2px solid #22d3ee;background:#0e283c73;border-radius:0 8px 8px 0}#log p.u{border-color:#4b7a8a;color:#8fb3bf}
.r{display:flex;gap:8px;padding:8px 14px 12px}input{flex:1;min-width:0;background:#0e283c73;border:1px solid #22d3ee66;color:inherit;padding:12px;border-radius:10px;font:inherit;font-size:16px}
button{background:#0e283c73;border:1px solid #22d3ee;color:#22d3ee;border-radius:10px;padding:0 14px;font-size:18px}button.on{background:#22d3ee;color:#021018}
#lg{z-index:10;position:fixed;inset:0;background:#030a14;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:24px}#lg[hidden]{display:none}#lg input{flex:none;width:100%;max-width:320px}
</style></head><body>
<div id='lg' hidden><b style='letter-spacing:.3em;color:#22d3ee'>J.A.R.V.I.S</b><input id='pw' type='password' placeholder='Parol'><button id='ok' style='padding:10px 24px'>Kirish</button><small id='er' style='color:#f87171'></small></div>
<header><span>J.A.R.V.I.S</span><span id='clk'></span></header>
<div id='st'><canvas id='c'></canvas><div id='s'>TAYYOR</div></div>
<div id='log'></div>
<div class='r'><input id='in' placeholder='Jarvisga yozing...' autocomplete='off'><button id='mic'>🎤</button><button id='sp'>🔇</button><button id='go'>➤</button></div>
<script>
const $=i=>document.getElementById(i),T='jt',dev=/Mobi|Android|iPhone/i.test(navigator.userAgent)?'telefon':'kompyuter';
let tok=localStorage.getItem(T)||'',tg=.15,amp=.15,speak=false,busy=false;
const api=async(p,b)=>{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='login'){tok='';localStorage.removeItem(T);$('lg').hidden=false;throw Error('auth')}if(!r.ok)throw Error(j.error||'xato');return j};
function add(t,u){const p=document.createElement('p');if(u)p.className='u';p.textContent=t;$('log').appendChild(p);$('log').scrollTop=1e9}
async function load(){try{const h=await api('history');$('log').innerHTML='';h.forEach(m=>add(m.content,m.role==='user'));$('lg').hidden=true}catch(e){}}
$('ok').onclick=async()=>{try{const r=await api('login',{password:$('pw').value});tok=r.token;localStorage.setItem(T,tok);$('pw').value='';$('er').textContent='';load()}catch(e){$('er').textContent=e.message}};
function say(t){$('s').textContent='GAPIRMOQDA';tg=.8;const end=()=>{tg=.15;$('s').textContent='TAYYOR'};if(speak&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);u.lang='uz-UZ';u.onend=end;speechSynthesis.cancel();speechSynthesis.speak(u)}else setTimeout(end,Math.min(t.length*30,4000))}
async function send(){const q=$('in').value.trim();if(!q||busy)return;$('in').value='';add(q,1);busy=true;$('s').textContent=`O'YLAMOQDA`;tg=.55;try{const r=await api('chat',{text:q,device:dev});add(r.reply);say(r.reply)}catch(e){add('Xato: '+e.message);tg=.15;$('s').textContent='TAYYOR'}busy=false}
$('go').onclick=send;$('in').onkeydown=e=>{if(e.key==='Enter')send()};
$('sp').onclick=()=>{speak=!speak;$('sp').textContent=speak?'🔊':'🔇';$('sp').className=speak?'on':''};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('Bu brauzerda ovoz yozish ishlamaydi.');return}const r=new SR();r.lang='uz-UZ';r.onstart=()=>{$('mic').className='on';$('s').textContent='TINGLAYAPMAN';tg=.6};r.onend=()=>{$('mic').className='';if(!busy){$('s').textContent='TAYYOR';tg=.15}};r.onresult=e=>{$('in').value=e.results[0][0].transcript;send()};try{r.start()}catch(e){}};
setInterval(()=>{$('clk').textContent=new Date().toTimeString().slice(0,8)},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tok&&!busy)load()});setInterval(()=>{if(!document.hidden&&tok&&!busy)load()},15000);
const cv=$('c'),x=cv.getContext('2d'),D=devicePixelRatio||1,P=[];let W,H,t=0;for(let i=0,n=900,a=Math.PI*(3-Math.sqrt(5));i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y);P.push([Math.cos(a*i)*r,y,Math.sin(a*i)*r])}
function rs(){const r=cv.parentElement.getBoundingClientRect();W=cv.width=r.width*D;H=cv.height=r.height*D}addEventListener('resize',rs);rs();
(function f(){requestAnimationFrame(f);t+=.016;amp+=(tg-amp)*.06;x.fillStyle='rgba(3,10,20,.3)';x.fillRect(0,0,W,H);const R=Math.min(W,H)*.34,cx=W/2,cy=H/2,ca=Math.cos(t*.5),sa=Math.sin(t*.5);x.fillStyle='#22d3ee';for(const[p,y,q]of P){const w=(Math.sin(3*p+t*1.4)+Math.sin(4*y+t*1.9)+Math.sin(5*q+t*1.1))/3,k=1+(.08+amp*.45)*w,X=(p*ca+q*sa)*k,Z=(-p*sa+q*ca)*k,Y=y*k,s=1/(1-Z*.25),al=(Z+1.2)/2.4;x.globalAlpha=Math.max(.1,Math.min(1,al));x.fillRect(cx+X*R*s,cy+Y*R*s,D*(1+al*1.2),D*(1+al*1.2))}x.globalAlpha=1})();
if(tok)load();else $('lg').hidden=false;
</script></body></html>
